<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/style/global.css">
    <link rel="stylesheet" href="../assets/style/paginas/login.css">
    <title>Login - Click Rails</title>
</head>

<body>
    <main class="login-wrapper">
        <section class="login-card">
            <div class="login-imagem">
                <img src="../assets/img/reutilizaveis/trem_estacionado.jpg" alt="Estação ferroviária" />
            </div>
            <div class="login-area">
                <a href="../index.html" class="login-voltar">Voltar</a>
                <h1><strong>Login</strong></h1>

                <div class="login-formulario">
                    <div class="alert alert-primary d-none" role="alert">
                        Usuário não encontrado!
                    </div>

                    <div class="login-campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Insira seu e-mail aqui..." />
                    </div>

                    <div class="login-campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Insira sua senha aqui..." />
                    </div>

                    <button class="btn botao-azul-escuro w-100">Entrar</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
