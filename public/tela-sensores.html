<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/style/global.css">
    <title>Sensores - Click Rails</title>
</head>

<body>
    <header>
        <nav class="nav d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="../assets/img/logo/logo_clara.png" alt="Logo Click Rails" class="logo-navbar">
                <p><strong>Click Rails</strong></p>
            </div>
            <button class="btn botao-cinza" onclick="window.location.href='public/tela-login.html'">Sair</button>
        </nav>
    </header>

    <main class="layout-app">
        <section class="sidebar-app">
            <div class="nav-sidebar">
                <a href="tela-home.html" class="link-sidebar">
                    <i class="bi bi-house-door"></i>
                    <span>Início</span>
                </a>
                <a href="#" class="link-sidebar">
                    <i class="bi bi-grid"></i>
                    <span>Dashboards</span>
                </a>
                <a href="colaboradores.html" class="link-sidebar">
                    <i class="bi bi-person"></i>
                    <span>Colaboradores</span>
                </a>
                <a href="tela-sensores.html" class="link-sidebar ativo">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Sensores</span>
                </a>
                <a href="#" class="link-sidebar">
                    <i class="bi bi-inbox"></i>
                    <span>Registros</span>
                </a>
            </div>
        </section>

        <section class="conteudo-app">
            <div class="cabecalho-app">
                <h1>Central de Sensores</h1>
                <p>Gerencie todos os sensores cadastrados no sistema.</p>
            </div>
 
            <div class="mb-4">
                <label class="mb-2">Pesquisar sensor</label>
                <div class="sensores-barra d-flex gap-2">
                    <input type="text" id="inputPesquisa" class="sensores-input flex-grow-1" placeholder="ex. Acelerômetro">
                    <button type="button" class="btn botao-branco" id="botaoCadastrarSensor"> Adicionar sensor </button>
                </div>
            </div>
 
            <div class="card-secao">
                <h3 class="titulo-secao mb-4">Sensores</h3>
                <div id="listaSensores">

                </div>
                <p id="mensagemVazia" class="mensagem-vazia">Nenhum sensor cadastrado no momento!</p>
            </div>
        </section>
    </main>

    <!-- MODAL DE CADASTRO -->
<div class="modal fade" id="modalCadastroSensor" tabindex="-1"
    aria-labelledby="modalCadastroSensorLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h1 class="modal-title fs-5" id="modalCadastroSensorLabel">
                    Cadastrar Sensor
                </h1>

                <button type="button" class="btn-close"
                    data-bs-dismiss="modal" aria-label="Fechar"></button>

            </div>

            <div class="modal-body">

                <div class="mensagem-cadastro mb-3">
                    Preencha os dados para cadastrar
                </div>

                <form id="formularioCadastroSensor">

                    <div class="mb-3">
                        <label for="nomeSensor" class="form-label">
                            Nome do sensor
                        </label>

                        <input type="text"
                            class="form-control"
                            id="nomeSensor"
                            name="nome_sensor"
                            placeholder="ex. Acelerômetro"
                            required>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="tipoSensor" class="form-label">
                                Tipo
                            </label>

                            <input type="text"
                                class="form-control"
                                id="tipoSensor"
                                name="tipo_sensor"
                                placeholder="ex. Movimento"
                                required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="numeroSerie" class="form-label">
                                Número de série
                            </label>

                            <input type="text"
                                class="form-control"
                                id="numeroSerie"
                                name="numero_serie"
                                required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label for="descricaoSensor" class="form-label">
                            Descrição
                        </label>

                        <textarea
                            class="form-control"
                            id="descricaoSensor"
                            name="descricao"
                            rows="3"
                            placeholder="Descrição do sensor"></textarea>
                    </div>

                    <button type="submit" class="btn botao-cadastrar w-100">
                        Cadastrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"crossorigin="anonymous"></script>

    <script>
        const botaoCadastrarSensor = document.getElementById("botaoCadastrarSensor");
        const modalCadastroSensor = document.getElementById("modalCadastroSensor");

        const modalSensor = new bootstrap.Modal(modalCadastroSensor);

        botaoCadastrarSensor.addEventListener("click", function () {
            modalSensor.show();
        });

        document.getElementById("formularioCadastroSensor").addEventListener("submit", function (event) {
            event.preventDefault();

            alert("Sensor cadastrado!");

            modalSensor.hide();

            this.reset();
        });
    </script>

</body>

</html>
